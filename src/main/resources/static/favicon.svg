<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>SCIM Server Manager</title>
  <defs>
    <linearGradient id="mgmt-bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#mgmt-bg)"/>
  <!-- lucide `server`, drawn as two solid bays rather than a scaled 2.2 hairline so the
       split-over-whole silhouette survives at 16px. LED pips are knocked out in the badge
       gradient's own accent, so they read as detail and never as a third element. -->
  <rect x="10" y="14" width="44" height="15" rx="6" fill="#f8fafc"/>
  <rect x="10" y="35" width="44" height="15" rx="6" fill="#7dd3fc"/>
  <circle cx="18.5" cy="21.5" r="2.6" fill="#1d4ed8"/>
  <circle cx="18.5" cy="42.5" r="2.6" fill="#0f172a" opacity="0.65"/>
</svg>
